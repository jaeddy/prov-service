[project]
name = "synprov"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click==7.0",
    "connexion>=2.0.2",
    "healthcheck>=1.3.3",
    "iso8601>=0.1.12",
    "jsonschema>=3.2.0",
    "luqum==0.8.0",
    "py2neo>=2.5.0",
    "pyhumps>=1.2.2",
    "python-dateutil==2.6.0",
    "pytz>=2019.1",
    "setuptools>=21.0.0",
    "swagger-ui-bundle==0.0.2",
    "werkzeug==0.16.1",
]

[project.scripts]
prov-service = "synprov.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
