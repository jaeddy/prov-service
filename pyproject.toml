[project]
name = "prov_service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=7.0",
    "connexion>=2.6.0",
    "flask==2.1.1",
    "iso8601>=0.1.12",
    "jsonschema>=3.2.0",
    "luqum==0.8.0",
    "neo4j>=5.28.1",
    "openapi-schema-validator>=0.1.3",
    "py-healthcheck>=1.10.1",
    "py2neo>=2.5.0",
    "pyhumps>=1.2.2",
    "python-dateutil==2.6.0",
    "pytz>=2019.1",
    "setuptools>=21.0.0",
    "swagger-ui-bundle>=0.0.2",
    "werkzeug==2.2.2",
]

[project.scripts]
prov-service = "prov_service.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]
